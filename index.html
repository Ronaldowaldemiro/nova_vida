    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const menuOptions = document.querySelector('.menu-options');

        menuToggle.addEventListener('click', () => {
        menuOptions.style.display = menuOptions.style.display === 'block' ? 'none' : 'block';
        menuToggle.querySelector('i').classList.toggle('fa-angle-down');
        menuToggle.querySelector('i').classList.toggle('fa-angle-up');
        });
        // Adiciona um evento de clique fora do menu para fechá-lo
        document.addEventListener('click', (event) => {
            if (!menuToggle.contains(event.target) && !menuOptions.contains(event.target)) {
                menuOptions.style.display = 'none';
                menuToggle.querySelector('i').classList.remove('fa-angle-up');
                menuToggle.querySelector('i').classList.add('fa-angle-down');
            }
        });
    </script>
